<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>物理仿真 - 电梯非惯性系动力学</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #00050a; font-family: 'Segoe UI', sans-serif; }
        
        /* 交互面板 (保留在左侧) */
        #ui-layer {
            position: absolute; top: 20px; left: 20px;
            width: 380px; z-index: 100; pointer-events: none;
        }

        .control-card {
            background: rgba(5, 15, 30, 0.9);
            border: 2px solid #00f2fe; border-radius: 12px;
            padding: 20px; color: #fff; margin-bottom: 15px;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
            pointer-events: auto;
        }

        h2 { color: #00f2fe; margin: 0 0 15px 0; font-size: 20px; text-shadow: 0 0 10px #00f2fe; }
        
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        button {
            background: rgba(0, 242, 254, 0.1); border: 1.5px solid #00f2fe; color: #00f2fe;
            padding: 10px; border-radius: 6px; cursor: pointer; flex: 1;
            font-size: 15px; font-weight: bold; transition: all 0.3s;
        }
        button:hover { background: #00f2fe; color: #000; }
        button.active { background: #00f2fe; color: #000; }

        #analysis-box {
            background: rgba(10, 20, 35, 0.95); border: 1px solid #ff2e63;
            padding: 15px; border-radius: 8px; display: none;
            pointer-events: auto; max-height: 50vh; overflow-y: auto; color: #fff;
        }
        .step { font-size: 15px; line-height: 1.6; margin-bottom: 12px; border-bottom: 1px solid #222; padding-bottom: 8px; }
        .math { color: #ffee00; font-family: 'Times New Roman', serif; font-weight: bold; font-size: 1.1em;}
        .highlight { color: #ff2e63; font-weight: bold; }

        #hint { position: absolute; bottom: 20px; right: 20px; color: #00f2fe; font-size: 15px; text-align: right; pointer-events: none; font-weight: bold; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 6px;}
    </style>
</head>
<body>

<div id="ui-layer">
    <div class="control-card">
        <h2>电梯动力学 - 3D 仿真推导</h2>
        <div class="btn-group">
            <button id="mode1" class="active" onclick="setMode(1)">1. 匀速上升</button>
            <button id="mode2" onclick="setMode(2)">2. 匀加速 (a₀)</button>
        </div>
        <button onclick="nextStep()" style="background: #ff2e63; border-color: #ff2e63; color: #fff;">数学解析步骤 ▶</button>
    </div>
    <div id="analysis-box">
        <div id="step-content"></div>
    </div>
</div>

<div id="hint">🖱️ 左键: 旋转 | 🖱️ 右键: 平移画面 | 🖱️ 滚轮: 缩放</div>

<script>
    let scene, camera, renderer, controls, lift, weightA, weightB, pulley, rope;
    let thickArrows = [], spriteLabels = [];
    
    // 物理参数
    let a_lift = 0;   
    let a_rel = 0, v_rel = 0, y_pos = 1;
    let currentMode = 1;
    let currentStep = 0;
    const g = 9.8, m1 = 15, m2 = 10;

    // 情景 1：匀速上升的数学推导步骤（惯性系）
    const stepsMode1 = [
        { t: "Step 1: 建立惯性参考系", c: "以匀速上升的电梯为参考系。此时电梯加速度为零，为<span class='highlight'>惯性系</span>，系统内无惯性力。" },
        { t: "Step 2: 列受力方程 (物 A)", c: "A 只受重力与张力。设向下为正方向，相对加速度为 <span class='math'>a</span>：<br><span class='math'>m₁g - T = m₁a</span>" },
        { t: "Step 3: 列受力方程 (物 B)", c: "B 只受重力与张力。设向上为正方向，相对加速度同为 <span class='math'>a</span>：<br><span class='math'>T - m₂g = m₂a</span>" },
        { t: "Step 4: 联立解析", c: "相对加速度：<br><span class='math'>a = [(m₁-m₂)/(m₁+m₂)]g</span><br>绳中张力：<br><span class='math'>T = [2m₁m₂/(m₁+m₂)]g</span>" }
    ];

    // 情景 2：匀加速上升的数学推导步骤（非惯性系）
    const stepsMode2 = [
        { t: "Step 1: 建立非惯性参考系", c: "以匀加速上升的电梯为参考系。因电梯有向上加速度 <span class='math'>a₀</span>，系统为<span class='highlight'>非惯性系</span>，重物受到向下的惯性力 <span class='math'>Fᵢ = -ma₀</span>。" },
        { t: "Step 2: 列受力方程 (物 A)", c: "选取向下为正方向。A 受到重力、张力和惯性力：<br><span class='math'>m₁g + m₁a₀ - T = m₁a'</span><br>此处 <span class='math'>a'</span> 为 A 的相对加速度。" },
        { t: "Step 3: 列受力方程 (物 B)", c: "选取向上为正方向。B 受到重力、张力和惯性力：<br><span class='math'>T - m₂g - m₂a₀ = m₂a'</span>" },
        { t: "Step 4: 联立解析", c: "相对加速度 (等效重力 g' = g+a₀)：<br><span class='math'>a' = [(m₁-m₂)/(m₁+m₂)](g+a₀)</span><br>绳中张力：<br><span class='math'>T = [2m₁m₂/(m₁+m₂)](g+a₀)</span>" }
    ];

    function init() {
        scene = new THREE.Scene();
        // 初始化相机位置，利用偏移产生画面右移的效果
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(-2, 6, 22);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 初始化 OrbitControls，完美支持右键平移和视角旋转
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        // 将视角焦点设定在屏幕坐标系的左侧，从而使得物理模型在视觉上整体向右移动
        controls.target.set(-4, 3, 0); 
        controls.enableDamping = true; // 增加平滑惯性
        controls.dampingFactor = 0.05;

        // 光照
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const light = new THREE.DirectionalLight(0xffffff, 0.9);
        light.position.set(5, 12, 10);
        scene.add(light);

        // 1. 电梯容器
        lift = new THREE.Mesh(new THREE.BoxGeometry(8, 14, 8), 
               new THREE.MeshPhongMaterial({ color: 0x00f2fe, wireframe: true, transparent: true, opacity: 0.15 }));
        scene.add(lift);

        // 2. 滑轮
        pulley = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.4, 32), new THREE.MeshPhongMaterial({ color: 0xcccccc }));
        pulley.rotation.z = Math.PI / 2;
        pulley.position.y = 6;
        lift.add(pulley);

        // 3. 物体 A & B
        weightA = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshPhongMaterial({ color: 0xff2e63 }));
        weightB = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshPhongMaterial({ color: 0x00ff95 }));
        lift.add(weightA);
        lift.add(weightB);

        // 4. 绳索初始化
        const ropeMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
        const ropeGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()]);
        rope = new THREE.Line(ropeGeo, ropeMat);
        lift.add(rope);

        // 5. 坐标系 (带有轴向标识)
        createAxisLabel();

        // 6. 标签与加粗受力系统
        setupForces();
        
        window.addEventListener('resize', onWindowResize, false);
        animate();
    }

    // 生成高分辨率、永不被遮挡的大号字体标签
    function makeTextSprite(message, color, scaleFactor = 1) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 512; canvas.height = 256; 
        ctx.font = "Bold 160px 'Segoe UI', Times New Roman"; 
        ctx.fillStyle = color;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(message, 256, 128);
        
        const texture = new THREE.CanvasTexture(canvas);
        // depthTest: false 确保文字图层始终悬浮在最顶层，不穿模
        const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false, transparent: true });
        const sprite = new THREE.Sprite(spriteMat);
        sprite.scale.set(3.5 * scaleFactor, 1.75 * scaleFactor, 1);
        return sprite;
    }

    // 突破 WebGL 限制，创建真正的 3D 实体加粗箭头
    function createThickArrow(colorHex) {
        const group = new THREE.Group();
        // 箭头轴 (圆柱)
        const shaftGeo = new THREE.CylinderGeometry(0.15, 0.15, 1, 16);
        shaftGeo.translate(0, 0.5, 0); // 将基准点移到底部
        const mat = new THREE.MeshPhongMaterial({ color: colorHex });
        const shaft = new THREE.Mesh(shaftGeo, mat);
        // 箭头尖 (圆锥)
        const headGeo = new THREE.ConeGeometry(0.35, 0.6, 16);
        headGeo.translate(0, 0.3, 0);
        const head = new THREE.Mesh(headGeo, mat);
        
        group.add(shaft);
        group.add(head);
        return { group, shaft, head };
    }

    function setupForces() {
        const colors = [0xff0000, 0xffff00, 0xbd00ff]; // T(红), G(黄), Fi(紫)
        const labels = ["T", "G", "Fi"];
        
        // 为 A 和 B 分别创建 T, G, Fi 箭头
        for (let i = 0; i < 6; i++) {
            const arrowObj = createThickArrow(colors[i % 3]);
            thickArrows.push(arrowObj);
            lift.add(arrowObj.group);

            const label = makeTextSprite(labels[i % 3], "#ffffff", 0.8);
            spriteLabels.push(label);
            lift.add(label);
        }

        // 物体中央大号名称标签
        const labelA = makeTextSprite("A", "#ffffff");
        const labelB = makeTextSprite("B", "#ffffff");
        spriteLabels.push(labelA, labelB);
        lift.add(labelA); lift.add(labelB);
    }

    function createAxisLabel() {
        const origin = new THREE.Vector3(-3.5, -6.5, 3.5);
        scene.add(new THREE.ArrowHelper(new THREE.Vector3(1,0,0), origin, 2, 0xff0000, 0.4, 0.2));
        scene.add(new THREE.ArrowHelper(new THREE.Vector3(0,1,0), origin, 2, 0x00ff00, 0.4, 0.2));
        scene.add(new THREE.ArrowHelper(new THREE.Vector3(0,0,-1), origin, 2, 0x00f2fe, 0.4, 0.2));
        
        const xL = makeTextSprite("x", "#ff0000", 0.7); xL.position.set(-1, -6.5, 3.5); scene.add(xL);
        const yL = makeTextSprite("y", "#00ff00", 0.7); yL.position.set(-3.5, -4.2, 3.5); scene.add(yL);
        const zL = makeTextSprite("z", "#00f2fe", 0.7); zL.position.set(-3.5, -6.5, 1.2); scene.add(zL);
    }

    function updatePhysics() {
        let g_eff = g + a_lift;
        a_rel = ((m1 - m2) / (m1 + m2)) * g_eff;
        v_rel += a_rel * 0.016;
        y_pos -= v_rel * 0.016;

        if (y_pos < -3.5) { y_pos = -3.5; v_rel *= -0.1; }
        if (y_pos > 3.5) { y_pos = 3.5; v_rel *= -0.1; }

        weightA.position.set(-1.2, y_pos, 0);
        weightB.position.set(1.2, -y_pos + 1.5, 0);

        // 更新滑轮连接的轻绳轨迹
        const points = [
            new THREE.Vector3(-1.2, y_pos, 0),
            new THREE.Vector3(-1.2, 6, 0),
            new THREE.Vector3(1.2, 6, 0),
            new THREE.Vector3(1.2, -y_pos + 1.5, 0)
        ];
        rope.geometry.setFromPoints(points);

        // 更新实体加粗力和标签
        let T_val = (2 * m1 * m2 / (m1 + m2)) * g_eff;
        const scale = 0.045; // 进一步减小比例系数，使箭头变得更短且紧凑

        // A 的受力更新
        updateThickArrow(0, weightA.position, 1, T_val * scale, 0);       // T
        updateThickArrow(1, weightA.position, -1, m1 * g * scale, 1);    // G
        updateThickArrow(2, weightA.position, -1, m1 * a_lift * scale, 2);// Fi
        
        // B 的受力更新
        updateThickArrow(3, weightB.position, 1, T_val * scale, 3);
        updateThickArrow(4, weightB.position, -1, m2 * g * scale, 4);
        updateThickArrow(5, weightB.position, -1, m2 * a_lift * scale, 5);

        // A/B 中心字母跟随位移
        spriteLabels[6].position.copy(weightA.position);
        spriteLabels[7].position.copy(weightB.position);
    }

    // 独立控制 3D 加粗箭头的缩放与转向
    function updateThickArrow(idx, pos, dirY, len, labelIdx) {
        const arrow = thickArrows[idx];
        const validLen = Math.max(len, 0.001); // 避免渲染错误
        
        arrow.group.position.copy(pos);
        
        // 控制箭头方向 (向上或向下)
        arrow.group.rotation.x = dirY < 0 ? Math.PI : 0;
        
        // 拉伸圆柱体作为箭柄
        arrow.shaft.scale.set(1, validLen, 1);
        // 将箭头放置在箭柄末端
        arrow.head.position.y = validLen;
        
        // 如果力过小（例如匀速运动时的惯性力），隐藏箭头
        arrow.group.visible = len > 0.1;

        // 标签位置偏移计算，使其始终位于箭头端点附近
        const labelOffset = dirY > 0 ? validLen + 0.8 : -(validLen + 0.8);
        spriteLabels[labelIdx].position.copy(pos).add(new THREE.Vector3(0.8, labelOffset, 0));
        spriteLabels[labelIdx].visible = len > 0.1;
    }

    function setMode(m) {
        currentMode = m;
        a_lift = (m === 2) ? 4.0 : 0;
        v_rel = 0; y_pos = 1; currentStep = 0;
        document.getElementById('mode1').className = m === 1 ? 'active' : '';
        document.getElementById('mode2').className = m === 2 ? 'active' : '';
        
        // 清空推导面板内容
        document.getElementById('step-content').innerHTML = "";
        document.getElementById('analysis-box').style.display = 'none';
    }

    function nextStep() {
        const box = document.getElementById('analysis-box');
        box.style.display = 'block';
        
        // 根据当前模式选择对应的推导步骤数组
        const activeSteps = currentMode === 1 ? stepsMode1 : stepsMode2;
        
        if (currentStep < activeSteps.length) {
            let s = activeSteps[currentStep];
            document.getElementById('step-content').innerHTML += `<div class='step'><b>${s.t}</b><br>${s.c}</div>`;
            currentStep++;
            // 自动滚动到底部
            box.scrollTop = box.scrollHeight;
        }
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update(); // 维持阻尼惯性
        updatePhysics();
        renderer.render(scene, camera);
    }

    init();

        // ================= Xiao D 开发者专属：一键封面生成器 =================
        window.addEventListener('keydown', function(e) {
            // 按下键盘上的字母 'P' 键触发完美截图
            if(e.key === 'p' || e.key === 'P') {
                const canvas = document.querySelector('canvas');
        
                // 注意：为了让 Three.js 能被截图，你的 renderer 初始化时必须带上 preserveDrawingBuffer: true 
                // 也就是：new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });

                const dataURL = canvas.toDataURL('images/png');
                const link = document.createElement('a');
                link.download = 'cover_' + document.title + '.png'; // 自动以模型名字命名
                link.href = dataURL;
                link.click();
        
                // 弹出赛博提示
                const hint = document.createElement('div');
                hint.innerHTML = '📸 完美封面已截取！';
                hint.style.cssText = 'position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#00f2fe; color:#000; padding:10px 20px; border-radius:8px; font-        weight:bold; z-index:99999;';
                document.body.appendChild(hint);
                setTimeout(() => hint.remove(), 2000);
            }
        });

</script>
</body>
</html>
