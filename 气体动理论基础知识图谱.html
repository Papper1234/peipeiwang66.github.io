<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大学物理 - 气体动理论基础科技图谱</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #05162a 0%, #000000 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #main { width: 100%; height: 100%; }

        #hud-panel {
            position: absolute; top: 20px; left: 20px;
            background: rgba(4, 21, 40, 0.7);
            border-left: 4px solid #00f2fe;
            padding: 15px 25px; border-radius: 4px;
            z-index: 10; backdrop-filter: blur(5px); color: #e0f7fa;
            border: 1px solid rgba(0, 242, 254, 0.2);
        }
        #hud-panel h2 { margin: 0 0 8px 0; font-size: 18px; color: #00f2fe; text-shadow: 0 0 8px #00f2fe; }
        #hud-panel p { margin: 4px 0; font-size: 13px; color: #88c0d0; }

        /* Tooltip 悬浮框排版加固 */
        .tech-tooltip {
            background: rgba(5, 15, 25, 0.98) !important;
            border: 1px solid #00f2fe !important;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4) !important;
            border-radius: 8px !important;
            padding: 18px !important;
            width: 320px; /* 固定基础宽度 */
            max-width: 400px;
            backdrop-filter: blur(12px);
            pointer-events: none;
        }
        .node-title {
            font-size: 19px; font-weight: bold; color: #00f2fe;
            margin-bottom: 12px; border-bottom: 1px solid rgba(0, 242, 254, 0.3);
            padding-bottom: 8px;
            display: block;
        }
        
        /* 强制描述文字在方框内换行 */
        .node-desc { 
            font-size: 14px; 
            line-height: 1.6; 
            color: #b0c4de; 
            margin-bottom: 15px;
            display: block;
            white-space: normal !important; /* 覆盖 ECharts 默认的强制不换行 */
            word-wrap: break-word !important;
            word-break: normal;
            text-align: justify;
        }

        /* 公式核心排版系统 */
        .formula-box {
            background: rgba(0, 242, 254, 0.08);
            border-radius: 6px; padding: 15px;
            border-left: 3px solid #00f2fe;
            display: flex; flex-direction: column; gap: 15px;
        }
        .formula-row {
            font-family: 'Times New Roman', Times, serif;
            font-size: 20px; color: #ffffff;
            display: flex; align-items: center; justify-content: flex-start;
            white-space: nowrap; /* 公式内部不换行以保证结构 */
        }

        .math-frac {
            display: inline-flex; flex-direction: column; align-items: center;
            vertical-align: middle; margin: 0 6px; line-height: 1;
        }
        .frac-top { padding: 0 4px; border-bottom: 1.5px solid #fff; padding-bottom: 2px; }
        .frac-bot { padding: 2px 4px 0 4px; }

        .math-sqrt {
            display: inline-flex; align-items: center; margin-left: 2px;
        }
        .sqrt-tick {
            font-size: 1.2em; transform: translateY(1px) scaleX(0.9);
            margin-right: -1px;
        }
        .sqrt-content {
            border-top: 1.5px solid #fff; padding-top: 3px;
            display: inline-flex; align-items: center;
        }

        .op { margin: 0 8px; color: #00f2fe; font-weight: bold; }
        .it { font-style: italic; }
        sub { font-size: 0.65em; vertical-align: sub; margin-left: 1px; }
    </style>
</head>
<body>

    <div id="hud-panel">
        <h2>物理引擎 - 气体动理论</h2>
        <p>核心模块: 微观碰撞与宏观统计</p>
        <p>[🖱️] 滚轮：全息缩放图谱</p>
        <p>[🤚] 拖拽：引力漫游节点</p>
        <p>[🎯] 悬浮：解析宏微观公式转化</p>
    </div>
    
    <div id="main"></div>

    <script>
        var myChart = echarts.init(document.getElementById('main'));
        
        const colors = ['#00e1fd', '#ffea00', '#ff0055', '#9dff00', '#ff8800', '#cc00ff', '#00ff95'];

        const frac = (t, b) => `<span class="math-frac"><span class="frac-top">${t}</span><span class="frac-bot">${b}</span></span>`;
        const sqrt = (content) => `<span class="math-sqrt"><span class="sqrt-tick">√</span><span class="sqrt-content">${content}</span></span>`;
        const op = (s) => `<span class="op">${s}</span>`;
        const it = (t) => `<span class="it">${t}</span>`;

        const nodesData = [
            { id: '0', name: '气体动理论', symbolSize: 90, category: 0, 
              desc: '研究物质热运动基本规律的理论。从物质的微观结构出发，利用统计方法阐明大量分子热运动的宏观表现。' },

            { id: '1', name: '分子动理论观念', symbolSize: 65, category: 1, desc: '一切宏观热现象的微观物理基础。' },
            { id: '1-1', name: '物质微观结构', symbolSize: 45, category: 1, desc: '物质由大量分子、原子组成。分子间有间隙。' },
            { id: '1-2', name: '热运动', symbolSize: 45, category: 1, desc: '分子处在永不停息的无规则运动中。运动剧烈程度与温度相关。' },
            { id: '1-3', name: '相互作用', symbolSize: 45, category: 1, desc: '分子间存在相互作用力（引力和斥力）。理想气体模型忽略分子除碰撞外的相互作用。' },
            { id: '1-4', name: '统计规律', symbolSize: 50, category: 1, desc: '个别分子的运动具有随机性，但大量分子的整体运动服从确定的统计规律。' },

            { id: '2', name: '平衡态与状态方程', symbolSize: 60, category: 2, desc: '在不受外界影响的条件下，系统的宏观性质不随时间变化的状态。' },
            { id: '2-1', name: '理想气体模型', symbolSize: 45, category: 2, desc: '微观：分子视为几何点（忽略体积）；除碰撞外无作用力；碰撞为完全弹性。' },
            { id: '2-2', name: '状态参量', symbolSize: 45, category: 2, desc: '描述宏观状态的物理量：压强 P、体积 V、温度 T。' },
            { id: '2-3', name: '理想气体状态方程', symbolSize: 55, category: 2, 
              desc: '克拉珀龙方程，描述平衡态下各参量的定量关系。',
              formula: [`${it('PV')} ${op('=')} ${it('nRT')} ${op('=')} ${frac(it('M'),it('μ'))}${it('RT')}`] },

            { id: '3', name: '压强公式', symbolSize: 65, category: 3, desc: '大量分子对容器壁不断碰撞的平均效果在宏观上的表现。' },
            { id: '3-1', name: '平均平动动能', symbolSize: 45, category: 3, 
              desc: '单个分子平动动能的统计平均值。',
              formula: [`${it('ε')}<sub>k</sub> ${op('=')} ${frac('1','2')}${it('mv')}²`] },
            { id: '3-2', name: '压强微观公式', symbolSize: 55, category: 3, 
              desc: '压强与分子数密度及分子平均平动动能成正比。',
              formula: [`P ${op('=')} ${frac('2','3')}${it('nε')}<sub>k</sub>`] },

            { id: '4', name: '温度微观本质', symbolSize: 65, category: 4, desc: '温度是分子平均平动动能的量度。' },
            { id: '4-1', name: '玻尔兹曼常数 (k)', symbolSize: 40, category: 4, desc: '连接宏观温度与微观动能的关键常数。k = R/N_A。' },
            { id: '4-2', name: '能量均分原理', symbolSize: 55, category: 4, 
              desc: '在平衡态下，分子的每一个自由度都具有相等的平均平动动能。',
              formula: [`${it('ε')}<sub>k</sub> ${op('=')} ${frac('3','2')}${it('kT')}`] },
            { id: '4-3', name: '统计意义', symbolSize: 45, category: 4, desc: '温度是大量分子热运动的集体表现，对单个分子谈温度没有意义。' },

            { id: '5', name: '速率分布律', symbolSize: 70, category: 5, desc: '描述处于平衡态的理想气体分子速率分布规律。' },
            { id: '5-1', name: '分布函数 f(v)', symbolSize: 50, category: 5, 
              desc: '速率在 v 附近的单位速率区间的分子数占总分子数的百分比。',
              formula: [`f(v) ${op('=')} ${frac(it('dN'), it('Ndv'))}`] },
            { id: '5-2', name: '麦克斯韦分布曲线', symbolSize: 45, category: 5, desc: '“中间多，两头少”。随温度升高，峰值向右移，曲线变宽。' },
            { id: '5-3', name: '三种特征速率', symbolSize: 60, category: 5, 
              desc: '最概然速率、平均速率、方均根速率。',
              formula: [
                `最概然 ${it('v')}<sub>p</sub> ${op('=')} ${sqrt(frac('2RT', it('μ')))}`,
                `平均 ${it('&lt;v&gt;')} ${op('=')} ${sqrt(frac('8RT', it('πμ')))}`,
                `方均根 ${it('v')}<sub>rms</sub> ${op('=')} ${sqrt(frac('3RT', it('μ')))}`
              ] },
            { id: '5-4', name: '速率区间的分子数', symbolSize: 45, category: 5, 
              desc: '计算处于速率区间 [v1, v2] 内的分子的概率。',
              formula: [`ΔN ${op('=')} N ${it('&int; f(v)dv')}`] }
        ];

        const linksData = [
            { source: '0', target: '1' }, { source: '0', target: '2' }, { source: '0', target: '3' },
            { source: '0', target: '4' }, { source: '0', target: '5' },
            { source: '1', target: '1-1' }, { source: '1', target: '1-2' }, { source: '1', target: '1-3' }, { source: '1', target: '1-4' },
            { source: '2', target: '2-1' }, { source: '2', target: '2-2' }, { source: '2', target: '2-3' },
            { source: '3', target: '3-1' }, { source: '3', target: '3-2' }, { source: '2-1', target: '3', value: '模型基础' },
            { source: '4', target: '4-1' }, { source: '4', target: '4-2' }, { source: '4', target: '4-3' },
            { source: '3-2', target: '4-2', value: '结合方程', lineStyle: { color: '#ff0055', type: 'dashed' } },
            { source: '5', target: '5-1' }, { source: '5', target: '5-2' }, { source: '5', target: '5-3' }, { source: '5', target: '5-4' },
            { source: '4', target: '5-2', value: '影响形态' },
            { source: '1-4', target: '5', value: '统计必然', lineStyle: { color: '#ff4d4f', width: 2, type: 'dashed' } },
            { source: '3-2', target: '2-3', value: '推导方程', lineStyle: { color: '#ff4d4f', width: 2, type: 'dashed' } },
            { source: '5-3', target: '3-1', value: '定义动能', lineStyle: { color: '#9dff00', width: 1.5, type: 'dotted' } }
        ];

        myChart.setOption({
            backgroundColor: 'transparent',
            tooltip: {
                trigger: 'item',
                enterable: true,
                padding: 0,
                borderWidth: 0,
                backgroundColor: 'transparent',
                formatter: function (params) {
                    if (params.dataType === 'node') {
                        let d = params.data;
                        let html = `<div class="tech-tooltip">
                                        <div class="node-title">${d.name}</div>
                                        <div class="node-desc">${d.desc}</div>`;
                        if (d.formula) {
                            html += `<div class="formula-box">`;
                            d.formula.forEach(f => { html += `<div class="formula-row">${f}</div>`; });
                            html += `</div>`;
                        }
                        return html + `</div>`;
                    }
                    return '';
                }
            },
            series: [{
                type: 'graph', layout: 'force',
                data: nodesData.map(node => ({
                    ...node, itemStyle: { color: colors[node.category % colors.length], shadowBlur: 20, shadowColor: colors[node.category % colors.length], borderColor: '#fff', borderWidth: 1.5 }
                })),
                links: linksData,
                roam: true, draggable: true,
                label: { show: true, position: 'right', color: '#e0f7fa', fontSize: 14 },
                edgeLabel: { show: true, formatter: (p) => p.data.value || '', fontSize: 11, color: '#00e1fd' },
                lineStyle: { color: 'rgba(0, 225, 253, 0.4)', curveness: 0.1, width: 1.5 },
                emphasis: { focus: 'adjacency', lineStyle: { width: 4 } },
                force: { repulsion: 2200, edgeLength: [100, 250], gravity: 0.1 }
            }]
        });

        window.addEventListener('resize', () => myChart.resize());
    </script>
</body>
</html>
