<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>布朗运动 3D 物理演练平台</title>
    <style>
        :root {
            --bg-color: #1a1d21;
            --panel-bg: rgba(30, 34, 40, 0.95);
            --border-color: #3e444c;
            --text-main: #d4d4d4;
            --accent-blue: #4fc1ff;
            --accent-yellow: #dcdcaa;
            --accent-green: #b5cea8;
        }
        body { margin: 0; overflow: hidden; background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', Tahoma, sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        /* 工业 CAD UI */
        #ui-panel {
            position: absolute; top: 20px; right: 20px; width: 340px; z-index: 10;
            background: var(--panel-bg); border: 1px solid var(--border-color);
            border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; font-size: 13px;
        }
        .panel-header { padding: 12px 16px; border-bottom: 1px solid var(--border-color); font-weight: bold; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
        .panel-section { padding: 12px 16px; border-bottom: 1px solid var(--border-color); }
        .panel-section:last-child { border-bottom: none; }
        
        .control-group { margin-bottom: 12px; }
        .control-label { display: flex; justify-content: space-between; margin-bottom: 6px; color: #aaa; }
        input[type="range"] { width: 100%; accent-color: var(--accent-blue); cursor: pointer; }
        
        .data-readout { background: #111; padding: 10px; border: 1px solid #333; border-radius: 4px; font-family: 'Consolas', monospace; font-size: 12px; line-height: 1.6; color: #aaa; margin-top: 10px; }
        .highlight { color: var(--accent-yellow); font-weight: bold; }
        .highlight-blue { color: var(--accent-blue); font-weight: bold; }

        button { width: 100%; padding: 8px; background: #2d2d30; border: 1px solid var(--border-color); color: var(--text-main); cursor: pointer; border-radius: 3px; font-family: inherit; transition: 0.2s; }
        button:hover { background: #3e3e42; }

        #axis-legend { position: absolute; bottom: 20px; left: 20px; z-index: 10; font-family: 'Consolas', monospace; font-size: 12px; color: #888; background: rgba(30,30,30,0.8); padding: 10px; border: 1px solid #333; border-radius: 4px; }
    </style>
</head>
<body>

<div id="ui-panel">
    <div class="panel-header">布朗运动 (Brownian Motion)</div>
    
    <div class="panel-section">
        <div class="control-group">
            <div class="control-label"><span>系统温度 T (分子速率)</span> <span id="val-temp" class="highlight-blue">中</span></div>
            <input type="range" id="slider-temp" min="1" max="10" step="0.5" value="5">
        </div>
        <div class="control-group">
            <div class="control-label"><span>宏观微粒质量比 (M/m)</span> <span id="val-mass" class="highlight">100</span></div>
            <input type="range" id="slider-mass" min="10" max="500" step="10" value="100">
        </div>
        <button id="btn-reset">重置系统状态</button>
    </div>

    <div class="panel-section">
        <div style="color: #aaa; margin-bottom: 5px;">实时运动数据</div>
        <div class="data-readout">
            <div>大颗粒速率: <span id="out-v" class="highlight">0.00</span> m/s</div>
            <div>碰撞频率: <span id="out-cps" class="highlight-blue">0</span> 次/秒</div>
            <hr style="border:0; border-top:1px solid #333; margin:6px 0;">
            <div style="color:#888;">随机游走轨迹已开启</div>
        </div>
    </div>
</div>

<div id="axis-legend">
    <span style="color:#dcdcaa">■</span> 宏观微粒 (Pollen/Dust)<br>
    <span style="color:#4fc1ff">■</span> 流体分子 (Fluid Molecules)<br>
    容器边界: L = 40 
</div>

<div id="canvas-container"></div>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ==========================================
    // 1. 物理环境与参数
    // ==========================================
    const Physics = {
        boxSize: 40,
        numMolecules: 800,
        m_small: 1.0,         // 小分子质量
        r_small: 0.4,         // 小分子半径
        M_big: 100.0,         // 大微粒质量 (可调)
        R_big: 3.0,           // 大微粒半径
        baseSpeed: 15.0,      // 基础分子速率 (对应温度)
        tempMultiplier: 1.0,
        dt: 0.016             // 固定的物理积分步长
    };

    let bigParticle = {
        pos: new THREE.Vector3(0, 0, 0),
        vel: new THREE.Vector3(0, 0, 0)
    };
    
    let molecules = [];
    let collisionCount = 0;
    let lastTime = performance.now();

    // 随机游走轨迹数据
    const MAX_TRACE_POINTS = 1000;
    const tracePositions = new Float32Array(MAX_TRACE_POINTS * 3);
    let traceIndex = 0;

    // ==========================================
    // 2. 3D 渲染器与场景 (CAD风格)
    // ==========================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1d21);
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(30, 25, 45);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 光照设置 (工业冷光)
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);

    // ==========================================
    // 3. 构建物理实体模型
    // ==========================================
    
    // [容器边界盒]
    const boxGeo = new THREE.BoxGeometry(Physics.boxSize, Physics.boxSize, Physics.boxSize);
    const boxEdges = new THREE.EdgesGeometry(boxGeo);
    const boxLines = new THREE.LineSegments(boxEdges, new THREE.LineBasicMaterial({ color: 0x3e444c }));
    scene.add(boxLines);

    // [大微粒 (宏观悬浮物)]
    const bigGeo = new THREE.SphereGeometry(Physics.R_big, 32, 32);
    const bigMat = new THREE.MeshLambertMaterial({ color: 0xdcdcaa }); // CAD黄色
    const bigMesh = new THREE.Mesh(bigGeo, bigMat);
    scene.add(bigMesh);

    // [小分子流体群体] 使用 InstancedMesh 提升渲染性能
    const smallGeo = new THREE.SphereGeometry(Physics.r_small, 8, 8);
    const smallMat = new THREE.MeshLambertMaterial({ color: 0x4fc1ff }); // CAD青蓝色
    const instancedMolecules = new THREE.InstancedMesh(smallGeo, smallMat, Physics.numMolecules);
    scene.add(instancedMolecules);

    // [随机游走轨迹线]
    const traceGeo = new THREE.BufferGeometry();
    traceGeo.setAttribute('position', new THREE.BufferAttribute(tracePositions, 3));
    traceGeo.setDrawRange(0, 0);
    const traceMat = new THREE.LineBasicMaterial({ color: 0xff5555, linewidth: 2 });
    const traceLine = new THREE.Line(traceGeo, traceMat);
    scene.add(traceLine);

    const dummy = new THREE.Object3D();

    // ==========================================
    // 4. 物理初始化与重置逻辑
    // ==========================================
    function randomVelocity(speed) {
        const theta = Math.random() * 2 * Math.PI;
        const phi = Math.acos(2 * Math.random() - 1);
        return new THREE.Vector3(
            speed * Math.sin(phi) * Math.cos(theta),
            speed * Math.sin(phi) * Math.sin(theta),
            speed * Math.cos(phi)
        );
    }

    function initPhysics() {
        // 重置大颗粒
        bigParticle.pos.set(0, 0, 0);
        bigParticle.vel.set(0, 0, 0);
        
        // 重置小分子
        molecules = [];
        const speed = Physics.baseSpeed * Physics.tempMultiplier;
        const halfBox = Physics.boxSize / 2 - Physics.r_small;
        
        for (let i = 0; i < Physics.numMolecules; i++) {
            // 随机位置，但避免初始出生在大颗粒内部
            let pos;
            do {
                pos = new THREE.Vector3(
                    (Math.random() - 0.5) * 2 * halfBox,
                    (Math.random() - 0.5) * 2 * halfBox,
                    (Math.random() - 0.5) * 2 * halfBox
                );
            } while (pos.length() < Physics.R_big + Physics.r_small);

            molecules.push({
                pos: pos,
                vel: randomVelocity(speed)
            });
        }

        // 重置轨迹
        traceIndex = 0;
        traceGeo.setDrawRange(0, 0);
        collisionCount = 0;
    }

    // ==========================================
    // 5. 核心物理计算引擎 (弹性碰撞方程)
    // ==========================================
    function checkWallCollision(p, r, isBig) {
        const halfBox = Physics.boxSize / 2 - r;
        ['x', 'y', 'z'].forEach(axis => {
            if (p.pos[axis] > halfBox) {
                p.pos[axis] = halfBox;
                p.vel[axis] *= -1;
            } else if (p.pos[axis] < -halfBox) {
                p.pos[axis] = -halfBox;
                p.vel[axis] *= -1;
            }
        });
    }

    function stepPhysics() {
        const dt = Physics.dt;
        const minDistSq = Math.pow(Physics.R_big + Physics.r_small, 2);

        // 1. 更新小分子位置并处理边界碰撞
        for (let i = 0; i < Physics.numMolecules; i++) {
            let m = molecules[i];
            m.pos.addScaledVector(m.vel, dt);
            checkWallCollision(m, Physics.r_small, false);

            // 2. 检测小分子与大颗粒的碰撞 (理想气体模型：忽略小分子间的碰撞)
            const distSq = m.pos.distanceToSquared(bigParticle.pos);
            if (distSq < minDistSq) {
                collisionCount++;
                
                // --- 三维弹性碰撞物理方程 ---
                const normal = new THREE.Vector3().subVectors(m.pos, bigParticle.pos).normalize();
                const relVel = new THREE.Vector3().subVectors(m.vel, bigParticle.vel);
                const velAlongNormal = relVel.dot(normal);

                // 只有当两者相对靠近时才处理碰撞
                if (velAlongNormal < 0) {
                    // 恢复系数 e = 1 (完全弹性)
                    const e = 1.0;
                    const j = -(1 + e) * velAlongNormal / ( (1 / Physics.m_small) + (1 / Physics.M_big) );

                    // 应用冲量改变量
                    const impulse = normal.clone().multiplyScalar(j);
                    
                    m.vel.add(impulse.clone().multiplyScalar(1 / Physics.m_small));
                    bigParticle.vel.sub(impulse.clone().multiplyScalar(1 / Physics.M_big));
                }

                // 防穿透修正 (推开)
                const overlap = (Physics.R_big + Physics.r_small) - Math.sqrt(distSq);
                if (overlap > 0) {
                    m.pos.add(normal.clone().multiplyScalar(overlap * 1.01)); // 小幅度推开
                }
            }
        }

        // 3. 更新大微粒位置与边界
        bigParticle.pos.addScaledVector(bigParticle.vel, dt);
        checkWallCollision(bigParticle, Physics.R_big, true);

        // 4. 记录轨迹
        if (traceIndex < MAX_TRACE_POINTS) {
            tracePositions[traceIndex * 3] = bigParticle.pos.x;
            tracePositions[traceIndex * 3 + 1] = bigParticle.pos.y;
            tracePositions[traceIndex * 3 + 2] = bigParticle.pos.z;
            traceIndex++;
            traceGeo.setDrawRange(0, traceIndex);
            traceGeo.attributes.position.needsUpdate = true;
        } else {
            // 数组写满后，采用数据平移法维持最新轨迹
            for (let i = 0; i < MAX_TRACE_POINTS - 1; i++) {
                tracePositions[i * 3] = tracePositions[(i + 1) * 3];
                tracePositions[i * 3 + 1] = tracePositions[(i + 1) * 3 + 1];
                tracePositions[i * 3 + 2] = tracePositions[(i + 1) * 3 + 2];
            }
            tracePositions[(MAX_TRACE_POINTS - 1) * 3] = bigParticle.pos.x;
            tracePositions[(MAX_TRACE_POINTS - 1) * 3 + 1] = bigParticle.pos.y;
            tracePositions[(MAX_TRACE_POINTS - 1) * 3 + 2] = bigParticle.pos.z;
            traceGeo.attributes.position.needsUpdate = true;
        }
    }

    // ==========================================
    // 6. UI 与渲染循环
    // ==========================================
    const $ = (id) => document.getElementById(id);

    $('slider-temp').addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        Physics.tempMultiplier = val / 5;
        $('val-temp').innerText = val < 4 ? "低" : (val > 7 ? "高" : "中");
        // 即时改变当前分子的速率大小，保持方向不变
        const targetSpeed = Physics.baseSpeed * Physics.tempMultiplier;
        molecules.forEach(m => {
            m.vel.normalize().multiplyScalar(targetSpeed);
        });
    });

    $('slider-mass').addEventListener('input', (e) => {
        Physics.M_big = parseFloat(e.target.value);
        $('val-mass').innerText = Physics.M_big;
    });

    $('btn-reset').addEventListener('click', initPhysics);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    initPhysics();

    let cpsTimer = 0;
    let frames = 0;

    function animate() {
        requestAnimationFrame(animate);

        // 物理更新 (可以考虑在性能允许下每帧多跑几次细化碰撞)
        stepPhysics();
        stepPhysics(); // 2倍速计算提升视觉连贯性

        // 更新 Three.js 网格状态
        bigMesh.position.copy(bigParticle.pos);

        for (let i = 0; i < Physics.numMolecules; i++) {
            dummy.position.copy(molecules[i].pos);
            dummy.updateMatrix();
            instancedMolecules.setMatrixAt(i, dummy.matrix);
        }
        instancedMolecules.instanceMatrix.needsUpdate = true;

        // 更新数据面板 (每秒更新一次 CPS)
        const now = performance.now();
        if (now - cpsTimer > 1000) {
            $('out-cps').innerText = collisionCount;
            collisionCount = 0;
            cpsTimer = now;
        }
        $('out-v').innerText = bigParticle.vel.length().toFixed(3);

        controls.update();
        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>
