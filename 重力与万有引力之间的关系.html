<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>定制版地球模型：重力与万有引力的立体矢量关系</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: white; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui-panel {
            position: absolute;
            top: 25px;
            left: 25px;
            background: rgba(10, 15, 25, 0.85);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.7);
            border: 1px solid #333;
            backdrop-filter: blur(5px);
            max-width: 320px;
            z-index: 10;
        }
        h2 { margin: 0 0 15px 0; font-size: 20px; color: #fff; text-align: center; text-transform: uppercase; letter-spacing: 1px;}
        .legend { margin: 8px 0; display: flex; align-items: center; font-size: 14px; font-weight: 500;}
        .color-box { width: 18px; height: 18px; margin-right: 12px; display: inline-block; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); }
        .formula { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 6px; margin: 20px 0; font-family: 'Courier New', monospace; font-size: 15px; text-align: center; border: 1px solid #444; color: #4da6ff;}
        .slider-container { margin-top: 20px; }
        label { font-size: 14px; color: #ccc; }
        #latValue { font-weight: bold; color: #fff; font-size: 16px; }
        input[type=range] { width: 100%; margin-top: 10px; cursor: pointer; }
        .note { font-size: 12px; color: #888; margin-top: 20px; line-height: 1.6; border-top: 1px solid #333; padding-top: 15px;}
        b { color: #fff; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-panel">
        <h2>立体矢量关系模型</h2>
        <div class="legend"><div class="color-box" style="background: #ff0000; box-shadow: 0 0 10px #ff0000;"></div> 万有引力 (F万) - 指向地心</div>
        <div class="legend"><div class="color-box" style="background: #00ff00; box-shadow: 0 0 10px #00ff00;"></div> 重力 (G) - 实际感受到的力</div>
        <div class="legend"><div class="color-box" style="background: #0077ff; box-shadow: 0 0 10px #0077ff;"></div> 向心力 (F向) - 维持自转</div>
        
        <div class="formula">
            <b>F万 = G + F向</b><br>
            <span style="color: #aaa; font-size: 12px;">(满足平行四边形定则)</span>
        </div>

        <div class="slider-container">
            <label for="latitudeSlider">调整纬度: <span id="latValue">45</span>° (北纬)</label><br>
            <input type="range" id="latitudeSlider" min="0" max="90" value="45">
        </div>

        <div class="note">
            *提示：<b>鼠标左键</b>旋转视角，<b>滚轮</b>缩放。<br>
            *说明：模型夸大了向心力比例以清晰展示矢量合成。真实赤道向心力仅为万有引力的 ~1/289。<br>
            *视觉：地球已淡化，聚焦立体箭头关系。
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // 1. 基础场景设置
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(30, 10, 30); // 优化初始视角

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio); // 提高清晰度
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 2. 创建地球模型 (淡化处理)
        const earthRadius = 10;
        const earthGroup = new THREE.Group();
        scene.add(earthGroup);

        // 高度透明的地球主体 (使用 Normal材质增加一点质感，但保持极淡)
        const earthGeometry = new THREE.SphereGeometry(earthRadius, 64, 64);
        const earthMaterial = new THREE.MeshNormalMaterial({ 
            transparent: true, 
            opacity: 0.08, // 极低透明度，几乎隐形
            wireframe: false
        });
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        earthGroup.add(earth);

        // 极淡的地球经纬线
        const wireframeMaterial = new THREE.LineBasicMaterial({ color: 0x666666, transparent: true, opacity: 0.1 });
        const wireframe = new THREE.LineSegments(new THREE.WireframeGeometry(earthGeometry), wireframeMaterial);
        earthGroup.add(wireframe);

        // 自转轴 (Y轴)
        const axisPoints = [new THREE.Vector3(0, -earthRadius * 1.4, 0), new THREE.Vector3(0, earthRadius * 1.4, 0)];
        const axisGeometry = new THREE.BufferGeometry().setFromPoints(axisPoints);
        const axisMaterial = new THREE.LineBasicMaterial({ color: 0x666666, transparent: true, opacity: 0.5 });
        const axisLine = new THREE.Line(axisGeometry, axisMaterial);
        earthGroup.add(axisLine);

        // 光源 (主要为箭头服务)
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const light1 = new THREE.DirectionalLight(0xffffff, 1);
        light1.position.set(10, 20, 15);
        scene.add(light1);
        const light2 = new THREE.DirectionalLight(0xffffff, 0.5);
        light2.position.set(-10, -10, -10);
        scene.add(light2);

        // 3. 定制立体箭头类
        class CustomFatArrow extends THREE.Group {
            constructor(color, name) {
                super();
                this.name = name;
                this.color = color;
                
                // 箭头材质 (开启高光)
                this.material = new THREE.MeshPhongMaterial({ 
                    color: color, 
                    shininess: 100, 
                    specular: 0x444444,
                    emissive: color,
                    emissiveIntensity: 0.3 // 增加一点自发光感
                });

                // 柱身 (Cylinder)
                this.shaftRadius = 0.15;
                this.shaft = new THREE.Mesh(new THREE.CylinderGeometry(this.shaftRadius, this.shaftRadius, 1, 16), this.material);
                
                // 箭头 (Cone)
                this.headRadius = 0.35;
                this.headLength = 0.8;
                this.head = new THREE.Mesh(new THREE.ConeGeometry(this.headRadius, this.headLength, 16), this.material);

                this.add(this.shaft);
                this.add(this.head);
                
                // 初始化放置
                this.head.position.y = 0.5; // 放在柱身顶部
            }

            setVector(vOrigin, vDir, magnitude) {
                if (magnitude < 0.01) {
                    this.visible = false;
                    return;
                }
                this.visible = true;

                // 1. 设置长度
                const shaftLength = Math.max(0.1, magnitude - this.headLength);
                this.shaft.scale.y = shaftLength;
                this.shaft.position.y = shaftLength / 2;
                this.head.position.y = shaftLength + this.headLength / 2;

                // 2. 设置位置和方向
                this.position.copy(vOrigin);
                
                // Three.js Cylinder默认朝向Y轴，需要旋转到目标方向
                const up = new THREE.Vector3(0, 1, 0);
                const quaternion = new THREE.Quaternion().setFromUnitVectors(up, vDir.normalize());
                this.setRotationFromQuaternion(quaternion);
            }
        }

        // 4. 立体矢量和物体 P 设置
        const objGroup = new THREE.Group();
        scene.add(objGroup);

        // 物体 P (发光小球)
        const objMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 32, 32), 
            new THREE.MeshPhongMaterial({ color: 0xffaa00, emissive: 0xffaa00, emissiveIntensity: 0.5 })
        );
        objGroup.add(objMesh);

        // 创建立体箭头
        const arrow_Fu = new CustomFatArrow(0xff0000, "Fu"); // 万有引力 (纯红)
        const arrow_Fc = new CustomFatArrow(0x0077ff, "Fc"); // 向心力 (亮蓝)
        const arrow_G  = new CustomFatArrow(0x00ff00, "G");  // 重力 (纯绿)
        
        scene.add(arrow_Fu);
        scene.add(arrow_Fc);
        scene.add(arrow_G);

        // 平行四边形辅助线 (也改为立体圆柱)
        const paraGroup = new THREE.Group();
        scene.add(paraGroup);
        const paraMat = new THREE.MeshPhongMaterial({ color: 0xcccccc, transparent: true, opacity: 0.5 });
        const lineGeom = new THREE.CylinderGeometry(0.03, 0.03, 1, 8);
        const line1 = new THREE.Mesh(lineGeom, paraMat);
        const line2 = new THREE.Mesh(lineGeom, paraMat);
        paraGroup.add(line1, line2);


        // 5. 更新矢量的核心函数
        function updateVectors(latitudeDegree) {
            const theta = latitudeDegree * (Math.PI / 180); 
            
            // 计算物体P的坐标 (放在XY平面上)
            const Px = earthRadius * Math.cos(theta);
            const Py = earthRadius * Math.sin(theta);
            const P = new THREE.Vector3(Px, Py, 0);
            objMesh.position.copy(P);

            // 1. 万有引力 F_u (指向地心)
            const F_u_mag = 8; 
            const vec_Fu = new THREE.Vector3(-Px, -Py, 0); // 方向矢量
            arrow_Fu.setVector(P, vec_Fu.clone().normalize(), F_u_mag);

            // 2. 向心力 F_c (垂直指向Y轴)
            const max_Fc_mag = 3.5; // 夸大比例
            const F_c_mag = max_Fc_mag * Math.cos(theta);
            const vec_Fc = new THREE.Vector3(-Px, 0, 0); // P在+X，向心力指向-X
            arrow_Fc.setVector(P, vec_Fc.clone().normalize(), F_c_mag);

            // 3. 重力 G = F_u - F_c (矢量减法，G是平行四边形的对角线)
            // 真实物理中 F_u = G + F_c，所以 G = F_u + (-F_c)
            const vec_G = vec_Fu.clone().normalize().multiplyScalar(F_u_mag).add(vec_Fc.clone().normalize().multiplyScalar(-F_c_mag));
            arrow_G.setVector(P, vec_G.clone().normalize(), vec_G.length());

            // 4. 更新立体平行四边形辅助线
            paraGroup.visible = (latitudeDegree > 1 && latitudeDegree < 89);
            if (paraGroup.visible) {
                // 点：P_Fu (Fu箭头顶点), P_G (G箭头顶点), P_Fc (Fc箭头顶点)
                const P_Fu = P.clone().add(vec_Fu.clone().normalize().multiplyScalar(F_u_mag));
                const P_G = P.clone().add(vec_G);
                const P_Fc = P.clone().add(vec_Fc.clone().normalize().multiplyScalar(F_c_mag));

                // 辅助线1: 从 Fu顶点 到 G顶点
                updateParamsLine(line1, P_Fu, P_G);
                // 辅助线2: 从 Fc顶点 到 G顶点
                updateParamsLine(line2, P_Fc, P_G);
            }
        }

        // 更新立体辅助线的辅助函数
        function updateParamsLine(lineMesh, start, end) {
            const v = new THREE.Vector3().subVectors(end, start);
            const len = v.length();
            lineMesh.scale.y = len;
            lineMesh.position.copy(start.clone().add(v.multiplyScalar(0.5)));
            const up = new THREE.Vector3(0, 1, 0);
            const quaternion = new THREE.Quaternion().setFromUnitVectors(up, v.normalize());
            lineMesh.setRotationFromQuaternion(quaternion);
        }

        // 6. 绑定 UI 滑块事件
        const slider = document.getElementById('latitudeSlider');
        const latValueText = document.getElementById('latValue');
        
        slider.addEventListener('input', function() {
            const lat = parseFloat(this.value);
            latValueText.innerText = lat;
            updateVectors(lat);
        });

        // 初始化
        updateVectors(45);

        // 7. 动画渲染循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }

        // 窗口大小自适应
        window.addEventListener('resize', () => {
            camera.aspect = (window.innerWidth - (window.innerWidth < 600 ? 0 : 0)) / window.innerHeight; // 简单适配
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

        // ================= Xiao D 开发者专属：一键封面生成器 =================
        window.addEventListener('keydown', function(e) {
            // 按下键盘上的字母 'P' 键触发完美截图
            if(e.key === 'p' || e.key === 'P') {
                const canvas = document.querySelector('canvas');
        
                // 注意：为了让 Three.js 能被截图，你的 renderer 初始化时必须带上 preserveDrawingBuffer: true 
                // 也就是：new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });

                const dataURL = canvas.toDataURL('images/png');
                const link = document.createElement('a');
                link.download = 'cover_' + document.title + '.png'; // 自动以模型名字命名
                link.href = dataURL;
                link.click();
        
                // 弹出赛博提示
                const hint = document.createElement('div');
                hint.innerHTML = '📸 完美封面已截取！';
                hint.style.cssText = 'position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#00f2fe; color:#000; padding:10px 20px; border-radius:8px; font-        weight:bold; z-index:99999;';
                document.body.appendChild(hint);
                setTimeout(() => hint.remove(), 2000);
            }
        });

    </script>
</body>
</html>
