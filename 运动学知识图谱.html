<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大学物理 - 运动学科技图谱 (专业修刻版)</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        /* 科技感深黑背景 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0a192f 0%, #000000 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #main { width: 100%; height: 100%; }

        /* 界面左上角 HUD 提示面板 */
        #hud-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(4, 21, 40, 0.7);
            border-left: 4px solid #00f2fe;
            border-top: 1px solid rgba(0, 242, 254, 0.3);
            border-bottom: 1px solid rgba(0, 242, 254, 0.3);
            border-right: 1px solid rgba(0, 242, 254, 0.3);
            padding: 15px 25px;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
            pointer-events: none;
            z-index: 10;
            backdrop-filter: blur(5px);
            color: #e0f7fa;
        }
        #hud-panel h2 { margin: 0 0 8px 0; font-size: 18px; color: #00f2fe; text-shadow: 0 0 8px #00f2fe; }
        #hud-panel p { margin: 4px 0; font-size: 13px; color: #88c0d0; }

        /* Tooltip 悬浮框样式 */
        .tech-tooltip {
            background: rgba(5, 15, 25, 0.95) !important;
            border: 1px solid #00f2fe !important;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3) !important;
            border-radius: 6px !important;
            padding: 15px !important;
            max-width: 320px;
            white-space: normal !important; 
            word-wrap: break-word;
            word-break: break-all;
            backdrop-filter: blur(10px);
        }
        .tech-tooltip .node-title {
            font-size: 18px;
            font-weight: bold;
            color: #00f2fe;
            margin-bottom: 10px;
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.5);
            border-bottom: 1px solid rgba(0, 242, 254, 0.3);
            padding-bottom: 6px;
        }
        .tech-tooltip .node-desc {
            font-size: 14px;
            line-height: 1.6;
            color: #b0c4de;
            margin: 0 0 12px 0;
            padding: 0;
            text-align: left;
        }

        /* 公式渲染外框 */
        .formula-box {
            background: rgba(0, 242, 254, 0.05);
            border-radius: 4px;
            padding: 12px 10px;
            border-left: 3px solid #00f2fe;
            display: flex;
            flex-direction: column; 
            gap: 12px; /* 增大公式行距 */
        }
        .formula-row {
            font-family: 'Times New Roman', Times, serif;
            font-size: 18px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center; /* 行内居中 */
            letter-spacing: 1px;
            width: 100%;
            min-height: 24px;
        }

        /* --- 核心优化：物理符号排版 --- */
        
        /* 1. 矢量符号 (完美居中上方箭头) */
        .vec {
            display: inline-block;
            position: relative;
            font-style: italic;
            font-weight: bold;
            margin: 0 3px;
            line-height: 1;
        }
        .vec::after {
            content: '→';
            position: absolute;
            top: -0.65em;
            left: 50%;
            transform: translateX(-50%) scale(0.65); /* 居中并缩小箭头 */
            font-weight: normal;
            font-style: normal;
        }

        /* 2. 重构的分数上下结构 (杜绝多余横线) */
        .math-frac {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            margin: 0 6px;
            font-size: 0.9em;
            line-height: 1;
        }
        .frac-top {
            padding: 0 2px;
        }
        .frac-line {
            width: 100%;
            height: 1px;
            background-color: #fff; /* 独立绘制一条真实横线 */
            margin: 3px 0;
        }
        .frac-bot {
            padding: 0 2px;
        }
        
        /* 下标微调 */
        sub { bottom: -0.25em; font-size: 0.75em; margin-left: 1px; }
        sup { top: -0.4em; font-size: 0.75em; margin-left: 1px; }
        
        .operator { margin: 0 5px; } /* 运算符间距 */
    </style>
</head>
<body>

    <div id="hud-panel">
        <h2>物理引擎 - 运动学</h2>
        <p>系统状态: 渲染正常</p>
        <p>[🖱️] 滚轮：全息缩放</p>
        <p>[🤚] 拖拽：引力漫游</p>
        <p>[🎯] 悬浮：解析底层公式</p>
    </div>
    
    <div id="main"></div>

    <script>
        var myChart = echarts.init(document.getElementById('main'));
        const colors = ['#00f2fe', '#4facfe', '#00e1fd', '#1890ff', '#87e8de', '#69c0ff', '#b37feb'];

        // --- HTML 公式生成器 ---
        const vec = (letter) => `<span class="vec">${letter}</span>`; 
        const frac = (top, bottom) => `<span class="math-frac"><span class="frac-top">${top}</span><span class="frac-line"></span><span class="frac-bot">${bottom}</span></span>`;
        const op = (char) => `<span class="operator">${char}</span>`;

        // --- 物理知识库数据 ---
        const nodesData = [
            { id: '0', name: '运动学', symbolSize: 75, category: 0, 
              desc: '研究物体空间位置随时间变化的规律，不涉及运动产生的原因。构成了经典力学的基础。' },

            // 1. 质点运动的描述
            { id: '1', name: '质点运动描述', symbolSize: 55, category: 1, desc: '描述质点运动状态的基本概念体系。' },
            { id: '1-1', name: '参考系', symbolSize: 40, category: 1, desc: '为描述物体运动而选定的标准物体。运动具有相对性，参考系的选择决定了运动的描述形式。' },
            { id: '1-4', name: '位矢 (r)', symbolSize: 45, category: 1, 
              desc: '由坐标原点指向质点所在位置的有向线段，是描述质点空间位置的矢量。', 
              formula: [`${vec('r')}${op('=')}x${vec('i')}${op('+')}y${vec('j')}${op('+')}z${vec('k')}`] },
            { id: '1-5', name: '位移 (Δr)', symbolSize: 45, category: 1, 
              desc: '质点位置的变化量，是矢量。方向由起点指向终点，与运动路径无关。',
              formula: [`Δ${vec('r')}${op('=')}${vec('r')}<sub>2</sub>${op('-')}${vec('r')}<sub>1</sub>`] },
            { id: '1-6', name: '路程 (Δs)', symbolSize: 40, category: 1, desc: '质点实际运动轨迹的长度，是标量，恒为正值。' },
            { id: '1-7-1', name: '平均速度', symbolSize: 40, category: 1, 
              desc: '质点在一段时间内的位移与这段时间的比值，表示平均快慢程度。',
              formula: [`${vec('v')}<sub>avg</sub>${op('=')}${frac('Δ'+vec('r'), 'Δt')}`] },
            { id: '1-7-2', name: '瞬时速度 (v)', symbolSize: 45, category: 1, 
              desc: '质点在某一时刻的运动快慢和方向。数学上等于位矢对时间的一阶导数。',
              formula: [`${vec('v')}${op('=')}lim<sub>Δt→0</sub> ${frac('Δ'+vec('r'), 'Δt')}${op('=')}${frac('d'+vec('r'), 'dt')}`] },
            { id: '1-8-2', name: '瞬时加速度 (a)', symbolSize: 45, category: 1, 
              desc: '描述速度随时间变化快慢和方向的物理量。等于速度对时间的一阶导数，位矢的二阶导数。',
              formula: [`${vec('a')}${op('=')}${frac('d'+vec('v'), 'dt')}${op('=')}${frac('d²'+vec('r'), 'dt²')}`] },

            // 2. 直线运动
            { id: '2', name: '直线运动', symbolSize: 55, category: 2, desc: '质点运动轨迹为一条直线的运动形式。' },
            { id: '2-1', name: '匀速直线', symbolSize: 40, category: 2, 
              desc: '加速度为0，速度大小和方向均保持不变的运动。',
              formula: [`x${op('=')}x<sub>0</sub>${op('+')}vt`] },
            { id: '2-2', name: '匀变速直线', symbolSize: 40, category: 2, 
              desc: '加速度为常矢量的直线运动。包含速度公式与位移公式。',
              formula: [
                  `v${op('=')}v<sub>0</sub>${op('+')}at`, 
                  `x${op('=')}x<sub>0</sub>${op('+')}v<sub>0</sub>t${op('+')}${frac('1', '2')}at²`
              ] // 彻底改用上下分数排版 ½ -> 1/2
            },

            // 3. 圆周运动
            { id: '3', name: '圆周运动', symbolSize: 55, category: 3, desc: '质点运动轨迹为圆周的运动。' },
            { id: '3-1', name: '角位置 (θ)', symbolSize: 40, category: 3, desc: '质点所在半径与参考轴的夹角，通常以弧度(rad)为单位。' },
            { id: '3-2', name: '角速度 (ω)', symbolSize: 45, category: 3, 
              desc: '描述质点绕圆心转动快慢的物理量，角位置对时间的一阶导数。',
              formula: [`ω${op('=')}${frac('dθ', 'dt')}`] },
            { id: '3-3', name: '角加速度 (α)', symbolSize: 45, category: 3, 
              desc: '角速度随时间的变化率，角速度对时间的一阶导数。',
              formula: [`α${op('=')}${frac('dω', 'dt')}`] },
            { id: '3-4', name: '切向加速度', symbolSize: 45, category: 3, 
              desc: '沿轨迹切线方向的加速度，只改变速度的大小，不改变方向。',
              formula: [`a<sub>t</sub>${op('=')}${frac('dv', 'dt')}${op('=')}rα`] },
            { id: '3-5', name: '法向加速度', symbolSize: 45, category: 3, 
              desc: '沿轨迹法线指向圆心的加速度（向心加速度），只改变速度方向。',
              formula: [`a<sub>n</sub>${op('=')}${frac('v²', 'r')}${op('=')}ω²r`] },

            // 4. 抛体运动
            { id: '4', name: '抛体运动', symbolSize: 55, category: 4, desc: '物体仅在重力作用下（忽略空气阻力）的运动。利用运动的独立性原理分解求解。' },
            { id: '4-1', name: '平抛运动', symbolSize: 40, category: 4, 
              desc: '初速度沿水平方向。水平方向为匀速直线运动，竖直方向为自由落体运动。',
              formula: [
                  `x${op('=')}v<sub>0</sub>t`,
                  `y${op('=')}${frac('1', '2')}gt²`
              ]
            },
            { id: '4-3', name: '射程与射高', symbolSize: 40, category: 4, 
              desc: '斜抛运动中，射程是水平方向最大距离，射高是竖直方向能达到的最大高度。',
              formula: [
                  `X${op('=')}${frac('v<sub>0</sub>² sin(2θ)', 'g')}`,
                  `Y${op('=')}${frac('v<sub>0</sub>² sin²θ', '2g')}`
              ]
            },

            // 5. 一般曲线运动
            { id: '5', name: '一般曲线', symbolSize: 55, category: 5, desc: '曲率半径随位置不断变化的复杂运动轨迹。' },
            { id: '5-1', name: '自然坐标系', symbolSize: 40, category: 5, desc: '以质点运动轨迹上任一点为原点，沿切线和主法线方向建立的局部坐标系。' },
            { id: '5-2', name: '曲率半径 (ρ)', symbolSize: 45, category: 5, 
              desc: '表示曲线在某一点弯曲程度的物理量。',
              formula: [`a<sub>n</sub>${op('=')}${frac('v²', 'ρ')}`] },

            // 6. 相对运动
            { id: '6', name: '相对运动', symbolSize: 55, category: 6, desc: '同一质点在不同参考系中运动规律的相互关系。' },
            { id: '6-1', name: '速度变换', symbolSize: 45, category: 6, 
              desc: '伽利略速度变换定理：绝对速度等于相对速度与牵连速度的矢量和。',
              formula: [`${vec('v')}<sub>a</sub>${op('=')}${vec('v')}<sub>r</sub>${op('+')}${vec('v')}<sub>e</sub>`] }
        ];

        // --- 有向连线关系 (带方向箭头) ---
        // 为了突出求导的单向关系，引入 symbol: ['none', 'arrow']
        const linksData = [
            // 主干结构线
            { source: '0', target: '1' }, { source: '0', target: '2' }, { source: '0', target: '3' },
            { source: '0', target: '4' }, { source: '0', target: '5' }, { source: '0', target: '6' },
            
            // 质点运动
            { source: '1', target: '1-1' }, { source: '1', target: '1-4' },
            { source: '1', target: '1-5' }, { source: '1', target: '1-6' }, { source: '1', target: '1-7-1' },
            { source: '1', target: '1-7-2' }, { source: '1', target: '1-8-2' },
            
            // ★ 核心单向逻辑线 (求导关系) ★
            { source: '1-4', target: '1-7-2', value: '求导', symbol: ['none', 'arrow'], symbolSize: [0, 10], lineStyle: { color: '#f5222d', width: 2, type: 'dashed' } }, 
            { source: '1-7-2', target: '1-8-2', value: '求导', symbol: ['none', 'arrow'], symbolSize: [0, 10], lineStyle: { color: '#f5222d', width: 2, type: 'dashed' } }, 

            // 直线运动
            { source: '2', target: '2-1' }, { source: '2', target: '2-2' },

            // 圆周运动
            { source: '3', target: '3-1' }, { source: '3', target: '3-2' }, { source: '3', target: '3-3' },
            { source: '3', target: '3-4' }, { source: '3', target: '3-5' },
            
            // ★ 核心单向逻辑线 (求导关系) ★
            { source: '3-1', target: '3-2', value: '求导', symbol: ['none', 'arrow'], symbolSize: [0, 10], lineStyle: { color: '#f5222d', width: 2, type: 'dashed' } }, 
            { source: '3-2', target: '3-3', value: '求导', symbol: ['none', 'arrow'], symbolSize: [0, 10], lineStyle: { color: '#f5222d', width: 2, type: 'dashed' } },

            // 抛体
            { source: '4', target: '4-1' }, { source: '4', target: '4-3' },

            // 曲线
            { source: '5', target: '5-1' }, { source: '5', target: '5-2' },
            { source: '5-1', target: '3-4' }, { source: '5-1', target: '3-5' },

            // 相对
            { source: '6', target: '6-1' }
        ];

        // --- 图表配置 ---
        const option = {
            backgroundColor: 'transparent',
            tooltip: {
                show: true,
                trigger: 'item',
                enterable: true,
                formatter: function (params) {
                    if (params.dataType === 'node') {
                        let data = params.data;
                        let html = `<div class="tech-tooltip">
                                        <div class="node-title">${data.name}</div>
                                        <div class="node-desc">${data.desc || ''}</div>`;
                        
                        // 独立行公式渲染
                        if (data.formula && data.formula.length > 0) {
                            html += `<div class="formula-box">`;
                            data.formula.forEach(f => {
                                html += `<div class="formula-row">${f}</div>`;
                            });
                            html += `</div>`;
                        }
                        html += `</div>`;
                        return html;
                    }
                    if (params.dataType === 'edge') {
                        return `<div class="tech-tooltip"><div class="node-title" style="margin:0;border:none;padding:0;">逻辑演进: ${params.data.value || '层级展开'}</div></div>`;
                    }
                },
                backgroundColor: 'transparent',
                borderWidth: 0,
                padding: 0,
                extraCssText: 'box-shadow: none;'
            },
            color: colors,
            series: [
                {
                    type: 'graph',
                    layout: 'force',
                    data: nodesData.map(node => ({
                        ...node,
                        itemStyle: {
                            color: colors[node.category % colors.length],
                            shadowBlur: 20,
                            shadowColor: colors[node.category % colors.length],
                            borderColor: '#fff',
                            borderWidth: 1.5
                        }
                    })),
                    links: linksData,
                    roam: true,
                    draggable: true,
                    label: {
                        show: true,
                        position: 'right',
                        formatter: '{b}',
                        fontSize: 14,
                        color: '#e0f7fa',
                        textShadowBlur: 6,
                        textShadowColor: '#00f2fe'
                    },
                    edgeLabel: {
                        show: true,
                        formatter: function(params) { return params.data.value || ''; },
                        fontSize: 12,
                        color: '#ff4d4f', // 将求导文字标红醒目
                        fontWeight: 'bold',
                        textShadowBlur: 3,
                        textShadowColor: '#000'
                    },
                    lineStyle: {
                        color: '#00e1fd',
                        curveness: 0.15,
                        width: 1.5,
                        opacity: 0.5,
                        shadowBlur: 5,
                        shadowColor: '#00f2fe'
                    },
                    emphasis: {
                        focus: 'adjacency',
                        lineStyle: { width: 4, opacity: 1, shadowBlur: 15 },
                        label: { fontSize: 16, fontWeight: 'bold' }
                    },
                    force: {
                        repulsion: 1500, // 增加斥力使节点散开
                        edgeLength: [120, 250],
                        gravity: 0.12
                    }
                }
            ]
        };

        myChart.setOption(option);
        window.addEventListener('resize', function() { myChart.resize(); });
    </script>
</body>
</html>
